apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - {
              name: argocd-ingress,
              project: platform,
              path: manifests/argocd,
              namespace: argocd,
            }
          - {
              name: dashboard,
              project: platform,
              path: manifests/dashboard,
              namespace: default,
            }
          - {
              name: monitoring,
              project: platform,
              path: manifests/monitoring,
              namespace: monitoring,
            }
          - {
              name: home-assistant,
              project: apps,
              path: manifests/home-assistant,
              namespace: home-assistant,
            }
          - {
              name: nextcloud,
              project: apps,
              path: manifests/nextcloud,
              namespace: nextcloud,
            }
          - {
              name: pwd-manager,
              project: apps,
              path: manifests/pwd-manager,
              namespace: vaultwarden,
            }
          - {
              name: syncthing,
              project: apps,
              path: manifests/syncthing,
              namespace: syncthing,
            }
          - {
              name: pterodactyl,
              project: apps,
              path: manifests/gaming/pterodactyl,
              namespace: gaming,
            }
          - {
              name: chromadb,
              project: apps,
              path: manifests/jarvis/chromadb,
              namespace: jarvis,
            }
          - {
              name: librechat,
              project: apps,
              path: manifests/jarvis/librechat,
              namespace: jarvis,
            }
          - {
              name: ollama,
              project: apps,
              path: manifests/jarvis/ollama,
              namespace: jarvis,
            }
          - {
              name: piper,
              project: apps,
              path: manifests/jarvis/piper,
              namespace: jarvis,
            }
          - {
              name: whisper,
              project: apps,
              path: manifests/jarvis/whisper,
              namespace: jarvis,
            }
          - {
              name: flaresolverr,
              project: apps,
              path: manifests/media-stack/flaresolverr,
              namespace: media,
            }
          - {
              name: jellyfin,
              project: apps,
              path: manifests/media-stack/jellyfin,
              namespace: media,
            }
          - {
              name: jellyseerr,
              project: apps,
              path: manifests/media-stack/jellyseerr,
              namespace: media,
            }
          - {
              name: plex,
              project: apps,
              path: manifests/media-stack/plex,
              namespace: media,
            }
          - {
              name: prowlarr,
              project: apps,
              path: manifests/media-stack/prowlarr,
              namespace: media,
            }
          - {
              name: qbittorrent,
              project: apps,
              path: manifests/media-stack/qbittorrent,
              namespace: media,
            }
          - {
              name: radarr,
              project: apps,
              path: manifests/media-stack/radarr,
              namespace: media,
            }
          - {
              name: sonarr,
              project: apps,
              path: manifests/media-stack/sonarr,
              namespace: media,
            }
  template:
    metadata:
      name: "{{ .name }}"
      namespace: argocd
    spec:
      project: "{{ .project }}"
      source:
        repoURL: "https://github.com/JanikHenz/my-homelab.git"
        targetRevision: HEAD
        path: "{{ .path }}"
      destination:
        name: homelab
        namespace: "{{ .namespace }}"
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers: [/spec/replicas]
        - group: apps
          kind: StatefulSet
          jsonPointers: [/spec/replicas]
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true
