# Creates one ArgoCD Application per entry in the list below.
# New app: add an entry (name, project, path, namespace) – nothing else needed.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # If an entry is removed from the list, only the Application is deleted.
    # The running resources stay in the cluster (safety net against typos).
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - {
              name: argocd-ingress,
              project: platform,
              path: manifests/argocd,
              namespace: argocd,
            }
          - {
              name: dashboard,
              project: platform,
              path: manifests/dashboard,
              namespace: default,
            }
          - {
              name: monitoring,
              project: platform,
              path: manifests/monitoring,
              namespace: monitoring,
            }
          - {
              name: home-assistant,
              project: apps,
              path: manifests/home-assistant,
              namespace: home-assistant,
            }
          - {
              name: nextcloud,
              project: apps,
              path: manifests/nextcloud,
              namespace: nextcloud,
            }
          - {
              name: pwd-manager,
              project: apps,
              path: manifests/pwd-manager,
              namespace: vaultwarden,
            }
          - {
              name: syncthing,
              project: apps,
              path: manifests/syncthing,
              namespace: syncthing,
            }
          - {
              name: bethegoat,
              project: apps,
              path: manifests/bethegoat,
              namespace: bethegoat,
            }
          - {
              name: pterodactyl,
              project: apps,
              path: manifests/gaming/pterodactyl,
              namespace: gaming,
            }
          - {
              name: chromadb,
              project: apps,
              path: manifests/jarvis/chromadb,
              namespace: jarvis,
            }
          - {
              name: librechat,
              project: apps,
              path: manifests/jarvis/librechat,
              namespace: jarvis,
            }
          - {
              name: ollama,
              project: apps,
              path: manifests/jarvis/ollama,
              namespace: jarvis,
            }
          - {
              name: piper,
              project: apps,
              path: manifests/jarvis/piper,
              namespace: jarvis,
            }
          - {
              name: whisper,
              project: apps,
              path: manifests/jarvis/whisper,
              namespace: jarvis,
            }
          - {
              name: flaresolverr,
              project: apps,
              path: manifests/media-stack/flaresolverr,
              namespace: media,
            }
          - {
              name: jellyfin,
              project: apps,
              path: manifests/media-stack/jellyfin,
              namespace: media,
            }
          - {
              name: jellyseerr,
              project: apps,
              path: manifests/media-stack/jellyseerr,
              namespace: media,
            }
          - {
              name: plex,
              project: apps,
              path: manifests/media-stack/plex,
              namespace: media,
            }
          - {
              name: prowlarr,
              project: apps,
              path: manifests/media-stack/prowlarr,
              namespace: media,
            }
          - {
              name: qbittorrent,
              project: apps,
              path: manifests/media-stack/qbittorrent,
              namespace: media,
            }
          - {
              name: radarr,
              project: apps,
              path: manifests/media-stack/radarr,
              namespace: media,
            }
          - {
              name: sonarr,
              project: apps,
              path: manifests/media-stack/sonarr,
              namespace: media,
            }
  template:
    metadata:
      name: "{{ .name }}"
      namespace: argocd
    spec:
      project: "{{ .project }}"
      source:
        repoURL: "https://github.com/JanikHenz/my-homelab.git"
        targetRevision: HEAD
        path: "{{ .path }}"
      destination:
        name: homelab
        namespace: "{{ .namespace }}"
      # Replicas are sometimes changed by hand (e.g. app stopped via the dashboard).
      # ArgoCD should not see that as a difference and scale the app back up.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers: [/spec/replicas]
        - group: apps
          kind: StatefulSet
          jsonPointers: [/spec/replicas]
      syncPolicy:
        # Git is the source of truth: changes in Git are applied automatically,
        # manual changes in the cluster are reverted (selfHeal) and resources
        # removed from Git are removed from the cluster (prune).
        automated:
          prune: true
          selfHeal: true
        # Needed so that a sync also leaves the replicas (see above) alone.
        syncOptions:
          - RespectIgnoreDifferences=true
