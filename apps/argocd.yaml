apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: "https://argoproj.github.io/argo-helm"
    chart: argo-cd
    targetRevision: 9.4.7
    helm:
      releaseName: argocd
      valuesObject:
        global:
          domain: argocd.janikhenz.ch
          nodeSelector:
            kubernetes.io/hostname: raspberrypi
        configs:
          params:
            server.insecure: true
        server:
          service:
            type: ClusterIP
  destination:
    name: homelab
    namespace: argocd
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
