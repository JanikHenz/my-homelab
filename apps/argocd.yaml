# ArgoCD manages itself through the official Helm chart.
# No automated sync on purpose: a broken change could take ArgoCD down,
# so upgrades are synced by hand in the UI.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: "https://argoproj.github.io/argo-helm"
    chart: argo-cd
    targetRevision: 9.4.7
    helm:
      releaseName: argocd
      valuesObject:
        global:
          domain: argocd.janikhenz.ch
          nodeSelector:
            kubernetes.io/hostname: raspberrypi
        configs:
          params:
            # Plain HTTP inside the cluster: HTTPS is handled by Cloudflare in front.
            server.insecure: true
        server:
          service:
            type: ClusterIP
  destination:
    name: homelab
    namespace: argocd
  syncPolicy:
    syncOptions:
      # The ArgoCD CRDs are too large for a normal (client-side) apply.
      - ServerSideApply=true
