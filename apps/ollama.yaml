apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: "https://github.com/JanikHenz/my-homelab.git"
    targetRevision: HEAD
    path: manifests/jarvis/ollama
  destination:
    name: homelab
    namespace: jarvis
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
