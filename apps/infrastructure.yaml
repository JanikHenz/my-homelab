# Cluster-wide resources (Helm chart in infrastructure/): namespaces,
# PersistentVolumes/Claims, NVIDIA device plugin.
# Kept separate from applicationset.yaml on purpose: it has no destination
# namespace and must ALWAYS be synced by hand and WITHOUT prune.
# When deleting this Application, ALWAYS choose "Non-cascading".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
spec:
  project: infrastructure
  source:
    repoURL: "https://github.com/JanikHenz/my-homelab.git"
    targetRevision: HEAD
    path: infrastructure
  destination:
    name: homelab
