apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-deployment
  namespace: jarvis
  labels:
    app: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      containers:
        - name: whisper
          image: rhasspy/wyoming-whisper:latest
          args:
            - "--model"
            - "tiny-int8"
            - "--language"
            - "de"
          ports:
            - containerPort: 10300
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
