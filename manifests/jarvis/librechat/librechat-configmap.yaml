apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
  namespace: jarvis
data:
  # Connects LibreChat to Ollama in the cluster. Ollama needs no API key,
  # LibreChat only requires some value. allowedAddresses is needed because
  # LibreChat blocks internal addresses by default.
  librechat.yaml: |
    version: 1.3.12
    cache: true
    interface:
      modelSelect: true
      parameters: true
      presets: true
    registration:
      socialLogins: []
    endpoints:
      allowedAddresses:
        - "ollama-service:11434"
      custom:
        - name: "Ollama"
          apiKey: "ollama"
          baseURL: "http://ollama-service:11434/v1"
          models:
            default: ["llama3.2"]
            fetch: true
          titleConvo: true
          modelDisplayLabel: "Ollama"
