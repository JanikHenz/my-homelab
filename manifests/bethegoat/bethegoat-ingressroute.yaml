# Enthält persönliche Daten (Gewicht, Ernährung) – nur hinter Cloudflare Access veröffentlichen.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bethegoat-ingressroute
  namespace: bethegoat
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`bethegoat.janikhenz.ch`)
      kind: Rule
      services:
        - name: bethegoat-service
          port: 80
