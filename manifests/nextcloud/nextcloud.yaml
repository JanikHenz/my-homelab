apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  labels:
    app: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      nodeSelector:
        kubernetes.io/hostname: homeserver
      containers:
        - name: nextcloud
          image: nextcloud:35.0.2
          ports:
            - containerPort: 80
          env:
            - name: OVERWRITEPROTOCOL
              value: "https"
            - name: OVERWRITECLIURL
              value: "https://nextcloud.janikhenz.ch"
            - name: OVERWRITEHOST
              value: "nextcloud.janikhenz.ch"
            - name: TRUSTED_PROXIES
              value: "10.42.0.0/16 10.43.0.0/16 192.168.0.0/16 127.0.0.1"
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/www/html
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data-pvc
