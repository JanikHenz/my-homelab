apiVersion: apps/v1
kind: Deployment
metadata:
  name: pterodactyl-wings
  namespace: gaming
  labels:
    app: pterodactyl-wings
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pterodactyl-wings
  template:
    metadata:
      labels:
        app: pterodactyl-wings
    spec:
      nodeSelector:
        kubernetes.io/hostname: homeserver
      # Game servers open their ports directly on the homeserver; Wings manages
      # these ports itself, so it uses the network of the host.
      hostNetwork: true
      containers:
        - name: wings
          image: ghcr.io/pterodactyl/wings:v1.11.13
          env:
            - name: WINGS_UID
              value: "988"
            - name: WINGS_GID
              value: "988"
            - name: TZ
              value: "Europe/Zurich"
            - name: WINGS_CONFIG_PATH
              value: "/etc/pterodactyl/config.yml"
          ports:
            - containerPort: 8080
              name: wings-api
              protocol: TCP
          securityContext:
            # Wings starts every game server as a Docker container on the host
            # (via docker.sock), which needs full privileges.
            privileged: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          # Same paths as on the host: Wings passes these paths to Docker, and Docker
          # looks them up on the host, not in this container.
          volumeMounts:
            - name: config
              mountPath: /etc/pterodactyl
            - name: servers
              mountPath: /mnt/data/pterodactyl/servers
            - name: backups
              mountPath: /mnt/data/pterodactyl/backups
            - name: archives
              mountPath: /mnt/data/pterodactyl/archives
            - name: tmp
              mountPath: /mnt/data/pterodactyl/tmp
            - name: docker-sock
              mountPath: /var/run/docker.sock
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pterodactyl-wings-config-pvc
        - name: servers
          persistentVolumeClaim:
            claimName: pterodactyl-servers-pvc
        - name: backups
          hostPath:
            path: /mnt/data/pterodactyl/backups
            type: DirectoryOrCreate
        - name: archives
          hostPath:
            path: /mnt/data/pterodactyl/archives
            type: DirectoryOrCreate
        - name: tmp
          hostPath:
            path: /mnt/data/pterodactyl/tmp
            type: DirectoryOrCreate
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
