apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pterodactyl-panel-ingressroute
  namespace: gaming
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pterodactyl.janikhenz.ch`)
      kind: Rule
      services:
        - name: pterodactyl-panel-service
          port: 80
