apiVersion: v1
kind: Service
metadata:
  name: pterodactyl-panel-service
  namespace: gaming
spec:
  # NodePort 30020: Wings runs with hostNetwork and reaches the panel via
  # <node-ip>:30020.
  type: NodePort
  selector:
    app: pterodactyl-panel
  ports:
    - name: http
      port: 80
      nodePort: 30020
---
apiVersion: v1
kind: Service
metadata:
  name: pterodactyl-wings-service
  namespace: gaming
spec:
  type: ClusterIP
  selector:
    app: pterodactyl-wings
  ports:
    - name: wings-api
      port: 8080
