# Secrets for Pterodactyl Panel and Wings
# WARNING: Change these default values before deploying!
# Generate strong passwords with: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: pterodactyl-secrets
  namespace: gaming
type: Opaque
stringData:
  # MariaDB passwords
  mariadb-root-password: "change-me-root-password"
  mariadb-password: "change-me-db-password"
  # Pterodactyl Panel APP_KEY (generate with: openssl rand -base64 32)
  app-key: "base64:change-me-generate-with-openssl-rand-base64-32"
  # Admin user credentials for initial setup
  admin-password: "admin-change-me"
