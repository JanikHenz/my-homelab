apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  # Created automatically when Grafana starts. The dashboards refer to the
  # datasource by its name "Prometheus" – do not rename it.
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false

  # Loads every dashboard JSON in /etc/grafana/dashboards (the
  # grafana-dashboard-*.yaml ConfigMaps) into the folder "Homelab".
  # Change dashboards in Git, not in the UI.
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: Homelab
        type: file
        disableDeletion: true
        updateIntervalSeconds: 60
        options:
          path: /etc/grafana/dashboards
