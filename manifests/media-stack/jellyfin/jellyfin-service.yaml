apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: media
spec:
  # NodePort 30001: reachable in the LAN via <node-ip>:30001 (TVs, apps),
  # also when the internet or the Cloudflare tunnel is down.
  type: NodePort
  selector:
    app: jellyfin
  ports:
    - port: 8096
      nodePort: 30001
